# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
#  Mientras el trigger sea solo `workflow_dispatch`, el workflow NO corre solo.
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

# A1: Trigger para que este workflow corra en cada Pull Request.
on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

# A4: bloque `concurrency` para que, si se pushea dos veces seguidas al mismo PR, se cancele el build anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: variables de entorno del build con los datos del commit, para que el footer muestre qué versión está desplegada.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      - name: Deploy a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # A3: nombre del secreto por el que creó
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_FIREBASE_CICD_33D61 }}
          projectId: practica-firebase-cicd-33d61
          # A3: tiempo que vive el preview (ej. 3d).
          expires: 3d
