# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

# A1: trigger para que corra en cada push a la rama `main`.
on:
  push:
    branches:
      - main

permissions:
  contents: read

# A4: en producción NO cancelar un deploy a mitad de camino, pero sí evitar dos deploys en paralelo.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # A5: asociar job a un GitHub Environment llamado `production` (permite exigir aprobación manual).
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: igual que en el workflow de PR, pero con los datos del push a main.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # A3: mismo secreto que en el workflow de PR.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_FIREBASE_CICD_33D61 }}
          projectId: practica-firebase-cicd-33d61
          # A3: ¿qué valor de channelId publica en producción?
          channelId: live
